services:
  postgres:
    image: postgres:16-alpine
    container_name: foodloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodloop
      POSTGRES_PASSWORD: foodloop_pass
      POSTGRES_DB: foodloop_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
